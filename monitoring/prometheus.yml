global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "fastapi-service"
    metrics_path: /metrics
    static_configs:
      # host.docker.internal resolves to the Windows host from inside the
      # container (Docker Desktop) - the FastAPI service runs natively on
      # the host, not in a container.
      - targets: ["host.docker.internal:8000"]
